name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: find src cartquill.php tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: ./vendor/bin/phpunit

  integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      # wp-env (Docker) provides WordPress + WooCommerce + MySQL and the WP
      # PHPUnit test library. The integration suite runs inside its tests-cli
      # container against a real $wpdb.
      - name: Start wp-env
        run: npx wp-env start

      # The WordPress test suite still calls PHPUnit\Util\Test::parseTestMethodAnnotations
      # (removed in PHPUnit 10), so the integration suite runs on PHPUnit 9 while the
      # DB-free unit suite stays on PHPUnit 10.
      - name: Download PHPUnit 9
        run: npm run test:integration:setup

      - name: Run integration tests
        run: npm run test:integration

  assets:
    name: Build & test JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Test JS
        run: npm run test:js

      - name: Build assets
        run: npm run build

  build:
    name: Build package & Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build production package
        run: bash bin/build.sh

      - name: Assert free/paid separation and a production autoloader
        run: |
          for path in src/Ai src/Deliverability src/Automations src/Admin/AiGeneratePage.php src/Admin/DeliverabilityPage.php tests composer.json CLAUDE.md .claude node_modules package.json package-lock.json webpack.config.js; do
            if [ -e "build/cartquill/$path" ]; then
              echo "::error::'$path' leaked into the free build"; exit 1
            fi
          done
          if find build/cartquill -name '.DS_Store' | grep -q .; then
            echo "::error::.DS_Store leaked into the free build"; exit 1
          fi
          if find build/cartquill -name '*.test.js' | grep -q .; then
            echo "::error::a *.test.js file leaked into the free build"; exit 1
          fi
          test -f build/cartquill/vendor/autoload.php || { echo "::error::built package is missing vendor/autoload.php"; exit 1; }
          test -f build/cartquill/assets/builder/build/index.js || { echo "::error::built package is missing the compiled flow builder bundle"; exit 1; }
          test -f build/cartquill/assets/builder/build/style-index.css || { echo "::error::built package is missing the compiled flow builder stylesheet"; exit 1; }

      - name: Build premium package
        run: bash bin/build.sh premium

      - name: Assert the premium package ships the paid add-ons but no dev cruft
        run: |
          # The paid add-ons the free build strips must be PRESENT in premium...
          for path in src/Ai/addon.php src/Automations/addon.php src/Deliverability/addon.php src/Admin/AiGeneratePage.php src/Admin/DeliverabilityPage.php; do
            if [ ! -e "build/premium/cartquill/$path" ]; then
              echo "::error::premium build is missing paid file '$path'"; exit 1
            fi
          done
          # ...and their classes must be in the optimized classmap so they autoload
          # (the classmap maps each paid class to its src/ path — assert on that).
          if ! grep -q "src/Ai/AiAddon.php" build/premium/cartquill/vendor/composer/autoload_classmap.php; then
            echo "::error::premium autoloader classmap is missing the paid AI classes"; exit 1
          fi
          # ...while dev/meta and free-build strippables stay out of premium too.
          for path in tests composer.json CLAUDE.md .claude node_modules package.json package-lock.json webpack.config.js; do
            if [ -e "build/premium/cartquill/$path" ]; then
              echo "::error::'$path' leaked into the premium build"; exit 1
            fi
          done
          if find build/premium/cartquill -name '*.test.js' | grep -q .; then
            echo "::error::a *.test.js file leaked into the premium build"; exit 1
          fi
          test -f build/premium/cartquill/vendor/autoload.php || { echo "::error::premium package is missing vendor/autoload.php"; exit 1; }
          # Building premium must not have clobbered the free zip.
          test -f build/cartquill.zip || { echo "::error::the free zip disappeared while building premium"; exit 1; }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cartquill-plugin
          path: |
            build/cartquill.zip
            build/cartquill-premium.zip

      # Plugin Check runs against the built free package. Informational for now:
      # some checks need a live WP environment and the AI proxy legal URLs are
      # still HITL placeholders, so a hard gate would block on known items.
      - name: Run Plugin Check (informational)
        continue-on-error: true
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/cartquill
          ignore-warnings: true
