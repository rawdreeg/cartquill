name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: find src cartquill.php tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: ./vendor/bin/phpunit

  integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      # wp-env (Docker) provides WordPress + WooCommerce + MySQL and the WP
      # PHPUnit test library. The integration suite runs inside its tests-cli
      # container against a real $wpdb.
      - name: Start wp-env
        run: npx wp-env start

      # The WordPress test suite still calls PHPUnit\Util\Test::parseTestMethodAnnotations
      # (removed in PHPUnit 10), so the integration suite runs on PHPUnit 9 while the
      # DB-free unit suite stays on PHPUnit 10.
      - name: Download PHPUnit 9
        run: npm run test:integration:setup

      - name: Run integration tests
        run: npm run test:integration

  assets:
    name: Build & test JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Test JS
        run: npm run test:js

      - name: Build assets
        run: npm run build

  build:
    name: Build package & Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The version is written in four places; a release refuses to deploy if they
      # disagree, so catch the drift on the pull request that introduces it.
      - name: Check the version is consistent everywhere
        run: bash bin/check-version.sh

      - name: Build production package
        run: bash bin/build.sh

      # The same gate the release workflow runs before publishing to
      # WordPress.org — kept in bin/ so the two cannot drift apart.
      - name: Assert core/paid separation and a production autoloader
        run: bash bin/verify-package.sh core

      - name: Build premium package
        run: bash bin/build.sh premium

      - name: Assert the premium package ships the paid add-ons but no dev cruft
        run: bash bin/verify-package.sh premium

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cartquill-plugin
          path: |
            build/cartquill.zip
            build/cartquill-premium.zip

      # Plugin Check runs against the built core package. Informational for now:
      # some checks need a live WP environment and the AI proxy legal URLs are
      # still HITL placeholders, so a hard gate would block on known items.
      - name: Run Plugin Check (informational)
        continue-on-error: true
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/cartquill
          ignore-warnings: true
